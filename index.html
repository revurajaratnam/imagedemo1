<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Home</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .car1{
            display:inline-flex;
            justify-content: center;
            align-items: center;
            width:20em;
            height:20em;
            margin-left:5em;
            margin-top: 5em;
            background-color: white;
            border-radius: 1em;
            filter: drop-shadow(10px 10px 10px rgba(0,0,0,0.25));
            transform-style: preserve-3d;
           

        }
         .car2{
            display:inline-flex;
            justify-content: center;
            align-items: center;
            width:20em;
            height:20em;
            margin-left:-20.23em;

            background-color: white;
            border-radius: 1em;
            filter: drop-shadow(10px 10px 10px rgba(0,0,0,0.25));
            transform-style: preserve-3d;
        }
        .car1:hover{
            background-color: transparent;
            border-radius: 1em;
            filter: drop-shadow(10px 15px 10px rgba(255, 204, 0, 0.999));
           
        }
        .car2:hover{
             opacity:0; 
        }

        img{
            width:20em;

        }
